[package]
name = "whist-game"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[features]
serde = ["dep:serde","dep:typetag"]

[dependencies]
itertools = "0.15.0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"

# Serde
serde = { version = "1.0.219", features = ["derive"], optional = true}
typetag = {version = "0.2.22", optional = true}
dyn-clone = "1.0.20"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
